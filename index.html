<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByHeart — memorize anything</title>
<meta name="theme-color" content="#0F1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Memorize any text — Arabic or any language — with chunking, cloze veils, first-letter cues, blind recall and spaced repetition.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Theme: Midnight Saffron (dark) — defaults */
  --ink:#0F1322;          /* background */
  --surface:#1A2138;      /* raised card */
  --surface-2:#222B4A;    /* interactive raised */
  --paper:#EDE7DA;        /* main text */
  --paper-dim:#B8B2A3;    /* secondary text */
  --saffron:#E4A63C;      /* accent */
  --saffron-deep:#B67F22;
  --veil:#2A3354;         /* hidden-word chip */
  --veil-edge:#3A4570;
  --edge:#262E4E;         /* card border */
  --on-accent:#0F1322;    /* text on accent-colored buttons */
  --sage:#7FB8A4;         /* good */
  --ember:#D96C5F;        /* again */
  --sky:#8FA8D9;          /* hard */
  --ar-size:1.6rem;       /* Arabic passage size (user setting) */
  --radius:14px;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Fraunces",Georgia,serif;
  --font-ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
}
html[data-theme="ink"][data-mode="light"]{
  --ink:#F7F3E9; --surface:#FFFFFF; --surface-2:#F0EADB;
  --paper:#23202E; --paper-dim:#6E6A5E;
  --saffron:#A8720F; --saffron-deep:#8A5D0A;
  --veil:#E7DFCB; --veil-edge:#CFC5A9; --edge:#E4DCC8;
  --on-accent:#FFFFFF;
  --sage:#2E7D5F; --ember:#BC4B3C; --sky:#4A6BAE;
}
html[data-theme="andalus"]{
  --ink:#0B1512; --surface:#132420; --surface-2:#1B322B;
  --paper:#E7EFE8; --paper-dim:#9EB3A6;
  --saffron:#4FB584; --saffron-deep:#358E64;
  --veil:#1E3A31; --veil-edge:#2E5346; --edge:#1C332C;
  --on-accent:#0B1512;
  --sage:#C9A25A; --ember:#D96C5F; --sky:#8FB8D9;
}
html[data-theme="andalus"][data-mode="light"]{
  --ink:#EFF4EE; --surface:#FFFFFF; --surface-2:#E2ECE3;
  --paper:#152420; --paper-dim:#5C7166;
  --saffron:#1F7A55; --saffron-deep:#155E41;
  --veil:#DCE8DD; --veil-edge:#B9CFBD; --edge:#D8E3D8;
  --on-accent:#FFFFFF;
  --sage:#96700F; --ember:#BC4B3C; --sky:#3E699C;
}
html[data-theme="rose"]{
  --ink:#181019; --surface:#251A28; --surface-2:#322338;
  --paper:#F1E7EE; --paper-dim:#B7A3B3;
  --saffron:#E094AC; --saffron-deep:#C06B87;
  --veil:#37243E; --veil-edge:#4E3557; --edge:#301F35;
  --on-accent:#181019;
  --sage:#8FB8A4; --ember:#E0785F; --sky:#9AA2E0;
}
html[data-theme="rose"][data-mode="light"]{
  --ink:#F9F2F5; --surface:#FFFFFF; --surface-2:#F2E4EB;
  --paper:#2A1626; --paper-dim:#7C6376;
  --saffron:#A8355F; --saffron-deep:#87264A;
  --veil:#F0DEE7; --veil-edge:#D9BCCB; --edge:#EBDAE3;
  --on-accent:#FFFFFF;
  --sage:#2E7D5F; --ember:#BC4B3C; --sky:#4A5BAE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:680px;margin:0 auto;padding:0 16px 96px}
header.top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:20px 2px 14px;
}
.brand{font-family:var(--font-display);font-weight:650;font-size:1.5rem;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand .dot{color:var(--saffron)}
.brand .mark{width:26px;height:26px;color:var(--saffron);flex:none}
button,.tappable{touch-action:manipulation}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:6px}
/* Today strip */
.today-strip{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:14px;font-size:.9rem;color:var(--paper-dim);
}
.today-strip b{color:var(--paper)}
.today-strip .flame{color:var(--saffron);font-weight:600}
/* Session summary */
.summary-card{text-align:center}
.summary-card .bignum{font-family:var(--font-display);font-size:2.6rem;color:var(--saffron);line-height:1.1}
/* Compact chunk rows */
.chunkrow{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--edge);border-radius:12px;
  padding:11px 14px;cursor:pointer;
}
.chunkrow:active{background:var(--surface-2)}
.chunkrow .snippet{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--paper-dim);font-size:.95rem;
}
.chunkrow .snippet.rtl{font-family:var(--font-ar);font-size:calc(var(--ar-size)*0.72)}
.chunkrow .ladder{flex:none}
.chunkrow .tag{flex:none}
.due-pill{
  font-size:.8rem;color:var(--on-accent);background:var(--saffron);
  border-radius:999px;padding:2px 10px;font-weight:600;
}
.due-pill.zero{background:var(--surface-2);color:var(--paper-dim)}
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;gap:8px;
  background:linear-gradient(to top, var(--ink) 65%, transparent);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:0 1 160px;
  background:var(--surface);color:var(--paper-dim);
  border:1px solid var(--veil-edge);border-radius:999px;
  padding:10px 0;font-family:var(--font-ui);font-size:.9rem;font-weight:500;
  cursor:pointer;
}
nav.tabs button.active{background:var(--saffron);border-color:var(--saffron);color:var(--on-accent);font-weight:600}
nav.tabs button.addfab{
  flex:0 0 52px;height:52px;border-radius:50%;padding:0;
  font-size:1.5rem;line-height:1;color:var(--saffron);
  border:1px solid var(--saffron);background:var(--surface);
  margin-top:-6px;
}
nav.tabs button.addfab:active{background:var(--saffron);color:var(--on-accent)}
.due-pill{cursor:pointer}
.due-pill.zero{cursor:default}
h2.screen-title{font-family:var(--font-display);font-weight:650;font-size:1.25rem;margin:6px 0 14px}
.muted{color:var(--paper-dim);font-size:.9rem}
.card{
  background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.card.tappable{cursor:pointer}
.card.tappable:active{background:var(--surface-2)}
button.primary,button.ghost,button.grade{
  font-family:var(--font-ui);border-radius:12px;cursor:pointer;font-size:.95rem;
  padding:12px 18px;border:none;font-weight:600;min-height:46px;
}
button.primary{background:var(--saffron);color:var(--on-accent)}
button.primary:active{background:var(--saffron-deep)}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--veil-edge)}
button.icon{
  background:var(--surface-2);border:1px solid var(--veil-edge);color:var(--paper);
  border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem;line-height:1;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
input[type=text],textarea,select{
  width:100%;background:var(--ink);border:1px solid var(--veil-edge);
  color:var(--paper);border-radius:10px;padding:12px;font-size:1rem;font-family:var(--font-ui);
}
textarea{min-height:150px;resize:vertical;line-height:1.7}
textarea.rtl,.rtl{direction:rtl;font-family:var(--font-ar);font-size:calc(var(--ar-size)*0.8)}
label.field{font-size:.85rem;color:var(--paper-dim);display:block;margin-bottom:6px}

/* ---------- Ladder (stage progress) ---------- */
.ladder{display:flex;gap:5px;align-items:center}
.ladder .rung{
  width:14px;height:6px;border-radius:3px;background:var(--veil);
}
.ladder .rung.done{background:var(--saffron)}
.ladder .rung.heart{width:10px;height:10px;border-radius:50%}
.ladder .rung.heart.done{background:var(--sage)}
.stage-name{font-size:.78rem;color:var(--paper-dim);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Reading / cloze text ---------- */
.passage{
  font-size:1.15rem;line-height:2;word-spacing:.05em;
  animation:riseIn .28s ease both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.passage.rtl{font-size:var(--ar-size);line-height:2.2}
.passage .w{padding:2px 3px;border-radius:6px}
.passage .veiled{
  background:var(--veil);color:transparent;cursor:pointer;
  border-bottom:2px solid var(--veil-edge);
  user-select:none;padding:3px 4px;
  transition:background .18s,color .18s;
}
.passage .veiled.peeked{background:transparent;color:var(--saffron);border-bottom-color:transparent}
.passage .fl{color:var(--paper)}
.passage .fl .rest{color:var(--paper-dim);opacity:.55;letter-spacing:2px}
.cue{
  color:var(--paper-dim);opacity:.75;font-size:.95em;
  border-inline-start:3px solid var(--saffron);padding-inline-start:10px;margin-bottom:12px;
}
.cue.rtl{font-family:var(--font-ar);font-size:calc(var(--ar-size)*0.8)}

.trainer-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.chunk-count{font-size:.85rem;color:var(--paper-dim)}
.stagebar{margin:2px 0 16px}
.hint{font-size:.85rem;color:var(--paper-dim);margin-top:10px}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
button.grade{padding:12px 4px;font-size:.9rem;color:var(--on-accent)}
.g-again{background:var(--ember)}
.g-hard{background:var(--sky)}
.g-good{background:var(--sage)}
.g-easy{background:var(--saffron)}
.grade small{display:block;font-weight:400;font-size:.7rem;opacity:.8}

.blind-box{
  min-height:120px;border:1px dashed var(--veil-edge);border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--paper-dim);
}
.progressline{height:4px;background:var(--veil);border-radius:2px;overflow:hidden;margin:8px 0 16px}
.progressline i{display:block;height:100%;background:var(--saffron)}

.empty{
  text-align:center;padding:40px 12px;color:var(--paper-dim);
}
/* ---------- Ayah markers (Quran mode) ---------- */
.passage .ayah{
  color:var(--saffron);font-size:.72em;vertical-align:middle;
  border:1px solid var(--veil-edge);border-radius:999px;
  padding:1px 8px;margin-inline:3px;white-space:nowrap;user-select:none;
}
/* ---------- Settings ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-card{
  border:2px solid var(--edge);border-radius:12px;padding:10px;cursor:pointer;
  text-align:center;background:var(--surface);
}
.theme-card.selected{border-color:var(--saffron)}
.theme-card .swatches{display:flex;justify-content:center;gap:5px;margin-bottom:8px}
.theme-card .sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.theme-card .tname{font-size:.8rem;color:var(--paper-dim)}
.mode-toggle{display:flex;gap:0;border:1px solid var(--veil-edge);border-radius:999px;overflow:hidden;width:max-content}
.mode-toggle button{
  border:none;background:transparent;color:var(--paper-dim);padding:9px 22px;
  font-family:var(--font-ui);font-size:.9rem;cursor:pointer;font-weight:500;
}
.mode-toggle button.on{background:var(--saffron);color:var(--on-accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--saffron)}
.ar-preview{
  direction:rtl;font-family:var(--font-ar);font-size:var(--ar-size);line-height:2;
  background:var(--ink);border:1px solid var(--veil-edge);border-radius:10px;
  padding:12px;text-align:center;
}
.empty .big{font-family:var(--font-display);font-size:1.2rem;color:var(--paper);margin-bottom:8px}
.danger{color:var(--ember)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:40;
  background:var(--surface-2);border:1px solid var(--veil-edge);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.toast.show{opacity:1}
.small-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:.75rem;background:var(--surface-2);border-radius:999px;padding:2px 10px;color:var(--paper-dim)}
.tag.due{background:var(--saffron);color:var(--on-accent);font-weight:600}
.continue-chip{
  background:var(--surface-2);border:1px solid var(--saffron);color:var(--saffron);
  border-radius:999px;padding:7px 16px;font-size:.85rem;font-weight:600;
  cursor:pointer;font-family:var(--font-ui);
}
.continue-chip:active{background:var(--saffron);color:var(--on-accent)}
.peekmeter{font-size:.8rem;color:var(--paper-dim);margin-top:10px}
.peekmeter b{color:var(--saffron)}
.passage.tight .w:not(.veiled){padding-left:0;padding-right:0}
button.linkish{
  background:none;border:none;padding:0;cursor:pointer;
  color:var(--saffron);font:inherit;text-decoration:underline;text-underline-offset:3px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><path d="M96 156 C96 292 168 342 256 342 C344 342 416 292 416 156" fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round"/><path d="M256 460 C240 442 208 431 208 404 C208 386 222 374 237 374 C245 374 252 379 256 387 C260 379 267 374 275 374 C290 374 304 386 304 404 C304 431 272 442 256 460 Z" fill="currentColor"/></svg>
      By<span class="dot">Heart</span>
    </div>
    <div class="row" style="gap:8px">
      <div id="duePill" class="due-pill zero" role="button" tabindex="0" onclick="if(dueChunks().length)go('review')">0 due</div>
      <button class="icon" onclick="go('settings')" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main id="screen"></main>
</div>

<nav class="tabs">
  <button id="tabLib" class="active" onclick="go('library')">Texts</button>
  <button class="addfab" onclick="go('add')" aria-label="Add a text">＋</button>
  <button id="tabRev" onclick="go('review')">Review</button>
</nav>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* ============ safe storage (falls back to memory) ============ */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ mem[k]=v; return false; } }
};

/* ============ state ============ */
const KEY = "byheart.v1";
const LANGS = ["","ar","he","zh","ja","ko","ru","th"];
let S; // loaded at startup (bottom of script), once every helper is defined
function load(){
  const raw = store.get(KEY);
  if(!raw) return normalizeState({texts:[]});
  try{ return normalizeState(JSON.parse(raw)); }
  catch(e){
    store.set(KEY+".corrupt", raw); // keep unreadable data rather than overwrite it on the next save
    return normalizeState({texts:[]});
  }
}
/* Validate and repair state from storage or a backup file, so a bad file can't break the app */
function normalizeState(s){
  if(!s || typeof s!=="object" || !Array.isArray(s.texts)) throw new Error("not a ByHeart backup");
  const num = (x,d) => (typeof x==="number" && isFinite(x)) ? x : d;
  const seen = new Set();
  const cleanId = x => {
    const id = (typeof x==="string" && /^[a-z0-9]{1,24}$/i.test(x) && !seen.has(x)) ? x : uid();
    seen.add(id); return id;
  };
  const texts = [];
  for(const t of s.texts){
    if(!t || !Array.isArray(t.chunks)) continue;
    const chunks = t.chunks
      .filter(c => c && typeof c.text==="string" && c.text.trim())
      .map((c,i) => ({
        id:cleanId(c.id), i, text:c.text,
        stage:Math.max(0, Math.min(5, Math.floor(num(c.stage,0)))),
        ef:Math.max(1.3, Math.min(2.8, num(c.ef,2.5))),
        reps:Math.max(0, num(c.reps,0)), interval:Math.max(0, num(c.interval,0)), due:num(c.due,0)
      }));
    for(const c of chunks) if(c.stage>=5 && !(c.due>0)) c.due = now(); // learned but unscheduled: review now
    if(!chunks.length) continue;
    const lang = LANGS.includes(t.lang) ? t.lang : detectLang(chunks.map(c=>c.text).join(" "));
    texts.push({ id:cleanId(t.id), title:String(t.title||"Untitled").slice(0,200), lang, rtl:isRTL(lang),
      quran:!!t.quran, chunks, created:num(t.created,now()) });
  }
  const log = {};
  if(s.log && typeof s.log==="object")
    for(const [k,v] of Object.entries(s.log))
      if(/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v==="object")
        log[k] = {learned:num(v.learned,0), reviews:num(v.reviews,0)};
  const st = s.settings || {};
  return { texts, log, settings:{
    theme: THEMES.some(t=>t.id===st.theme) ? st.theme : "ink",
    mode: st.mode==="light" ? "light" : "dark",
    arSize: Math.max(1.2, Math.min(2.6, num(st.arSize,1.6)))
  }};
}
let saveWarned = false;
function save(){
  if(!store.set(KEY, JSON.stringify(S)) && !saveWarned){
    saveWarned = true;
    toast("Couldn't save on this device — use Backup to keep your progress");
  }
  renderDuePill();
}
// Ask the browser not to evict our data under storage pressure (silently granted for installed apps)
function requestPersist(){ try{ navigator.storage.persist().catch(()=>{}); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const DAY = 86400000, HOUR = 3600000, MIN = 60000;

/* ============ daily log & streak ============ */
function dayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function logActivity(kind){
  S.log = S.log || {};
  const k = dayKey();
  S.log[k] = S.log[k] || {learned:0, reviews:0};
  S.log[k][kind] = (S.log[k][kind]||0)+1;
}
function todayStats(){ return (S.log && S.log[dayKey()]) || {learned:0, reviews:0}; }
function streak(){
  if(!S.log) return 0;
  let n=0; const d=new Date();
  for(;;){
    const e = S.log[dayKey(d)];
    if(e && (e.learned||e.reviews)) { n++; d.setDate(d.getDate()-1); }
    else if(n===0 && dayKey(d)===dayKey()){ d.setDate(d.getDate()-1); } // today empty so far — check yesterday
    else break;
    if(n>3650) break;
  }
  return n;
}

/* ============ language helpers ============ */
const ARABIC_CHAR = /[\u0600-\u06FF]/;
const ZWJ = "\u200D"; // zero-width joiner
const isArabicText = t => (t.match(/[\u0600-\u06FF]/g)||[]).length > t.length*0.15;
function detectLang(t){
  if(isArabicText(t)) return "ar";
  if(/[\u0590-\u05FF]/.test(t)) return "he";
  if(/[\u3040-\u30FF]/.test(t)) return "ja"; // kana before kanji: Japanese also uses CJK ideographs
  if(/[\u4E00-\u9FFF]/.test(t)) return "zh";
  if(/[\uAC00-\uD7AF]/.test(t)) return "ko";
  if(/[\u0E00-\u0E7F]/.test(t)) return "th";
  if(/[\u0400-\u04FF]/.test(t)) return "ru";
  return "";
}
const isRTL = lang => lang==="ar"||lang==="he";

/* Scripts written without spaces between words are split with Intl.Segmenter */
const SPACELESS = new Set(["zh","ja","th"]);
const joiner = lang => SPACELESS.has(lang) ? "" : " ";
const segmenters = {};
function segmenter(lang, granularity){
  const k = lang+"|"+granularity;
  if(!(k in segmenters)){
    try{ segmenters[k] = new Intl.Segmenter(lang||undefined, {granularity}); }catch(e){ segmenters[k] = null; }
  }
  return segmenters[k];
}
function tokenize(text, lang){
  if(!SPACELESS.has(lang)) return text.split(/\s+/).filter(Boolean);
  const seg = segmenter(lang, "word");
  // punctuation and spaces stay as their own tokens so the text re-joins exactly
  return seg ? [...seg.segment(text)].map(s=>s.segment) : [...text];
}
const isWordToken = w => /[\p{L}\p{N}]/u.test(w);
const countWords = (text, lang) => tokenize(text, lang).filter(w=>isWordToken(w) && !isAyahMark(w)).length;
function graphemes(w){
  const seg = segmenter("", "grapheme"); // keeps Arabic harakat and accents with their letter
  return seg ? [...seg.segment(w)].map(s=>s.segment) : [...w];
}

/* ============ chunking ============ */
// Pack units (sentences, verses) into chunks near targetWords, never splitting a unit
function packUnits(units, targetWords, lang){
  const chunks=[], J=joiner(lang);
  let cur=[], curWc=0;
  const flush = () => { if(cur.length) chunks.push(cur.join(J)); cur=[]; curWc=0; };
  for(const u of units){
    const w = countWords(u, lang);
    if(w===0 && !cur.length && chunks.length){ chunks[chunks.length-1] += J+u; continue; } // stray mark
    if(curWc>0 && curWc + w > targetWords*1.4) flush();
    cur.push(u); curWc += w;
    if(curWc >= targetWords) flush();
  }
  flush();
  return chunks;
}
// A unit far over the target is broken at commas first, then into even runs of words
function splitLong(unit, targetWords, lang){
  const max = targetWords*1.6, J = joiner(lang);
  if(countWords(unit, lang) <= max) return [unit];
  const out = [];
  for(const part of unit.split(/(?<=[,،])\s+|(?<=[、，])\s*/)){
    const p = part.trim(); if(!p) continue;
    const n = countWords(p, lang);
    if(n <= max){ out.push(p); continue; }
    const size = Math.ceil(n / Math.ceil(n/targetWords));
    let buf=[], bw=0;
    for(const tok of tokenize(p, lang)){
      buf.push(tok);
      if(isWordToken(tok) && ++bw >= size){ out.push(buf.join(J).trim()); buf=[]; bw=0; }
    }
    const rest = buf.join(J).trim();
    if(rest) out.push(rest);
  }
  return out;
}
function chunkText(raw, targetWords, lang){
  const text = raw.replace(/\r/g,"").trim();
  // sentence-ish units: newlines first, then sentence punctuation (Latin, Arabic, Devanagari, CJK)
  const units = [];
  for(const line of text.split(/\n+/)){
    for(const s of line.trim().split(/(?<=[.!?؟।۔…؛;:])\s+|(?<=[。！？；])\s*/)){
      if(s.trim()) units.push(...splitLong(s.trim(), targetWords, lang));
    }
  }
  return packUnits(units, targetWords, lang);
}

/* ============ Quran mode: verse-aware chunking ============ */
/* Ayah-end markers commonly found in pasted Quran text:
   ﴿١٢﴾ ornate parens · (12) [12] · ۝ (U+06DD) with optional digits ·
   a standalone run of Arabic-Indic digits ١٢٣ between words */
const AYAH_MARK = /(﴿\s*[٠-٩0-9]+\s*﴾|[\(\[]\s*[٠-٩0-9]+\s*[\)\]]|۝\s*[٠-٩0-9]*|(?:^|(?<=\s))[٠-٩]+(?=\s|$))/u;
function hasAyahMarks(t){
  const m = t.match(new RegExp(AYAH_MARK.source,"gu"));
  return !!m && m.length >= 2;
}
function isAyahMark(word){
  return /^(﴿\s*[٠-٩0-9]+\s*﴾|[\(\[]\s*[٠-٩0-9]+\s*[\)\]]|۝\s*[٠-٩0-9]*|[٠-٩]+)$/u.test(word);
}
function splitVerses(raw){
  const text = raw.replace(/\r/g,"").replace(/\n+/g," ").trim();
  const parts = text.split(new RegExp(AYAH_MARK.source,"u"));
  const verses=[];
  for(let i=0;i<parts.length;i+=2){
    const body = (parts[i]||"").trim();
    const mark = (parts[i+1]||"").trim();
    if(body) verses.push(mark ? body+" "+mark : body);
    else if(mark && verses.length) verses[verses.length-1]+=" "+mark;
  }
  return verses;
}
function chunkQuran(raw, targetWords){
  const verses = splitVerses(raw);
  if(!verses.length) return chunkText(raw, targetWords, "ar");
  // a verse is only broken when very long, and then only at a Quranic pause mark (waqf ۖ ۗ ۚ ۛ …)
  const units = verses.flatMap(v => countWords(v,"ar") > targetWords*2
    ? v.split(/(?<=[\u06D6-\u06DC])\s+/).filter(s=>s.trim())
    : [v]);
  return packUnits(units, targetWords, "ar");
}

/* ============ SRS (simplified SM-2) ============ */
function gradeChunk(c, g){ // g: 0 again, 1 hard, 2 good, 3 easy
  c.ef = c.ef ?? 2.5; c.reps = c.reps ?? 0; c.interval = c.interval ?? 0;
  if(g===0){ c.reps=0; c.interval=0; c.due=now()+10*MIN; c.ef=Math.max(1.3,c.ef-0.2); }
  else{
    if(g===1) c.ef=Math.max(1.3,c.ef-0.15);
    if(g===3) c.ef=Math.min(2.8,c.ef+0.1);
    c.reps++;
    if(c.reps===1) c.interval = g===3? 2:1;
    else if(c.reps===2) c.interval = g===3? 5:3;
    else c.interval = Math.round(c.interval * (g===1?1.2:g===2?c.ef:c.ef*1.35));
    c.due = now() + c.interval*DAY;
  }
}
const isDue = (c, t0=now()) => c.stage>=5 && c.due>0 && c.due<=t0;
function dueChunks(){
  const out=[], t0=now();
  for(const t of S.texts) for(const c of t.chunks)
    if(isDue(c,t0)) out.push({t,c});
  return out.sort((a,b)=>a.c.due-b.c.due); // most overdue first
}

/* ============ UI helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function renderDuePill(){
  const n = dueChunks().length;
  const p = $("duePill");
  p.textContent = n+" due";
  p.classList.toggle("zero", n===0);
}
const STAGES = ["Read","Veil ¼","Veil ½","First letters","By heart","Reviewing"];

/* ============ router ============ */
let route = {name:"library"};
function go(name, params, opts){
  route = Object.assign({name}, params||{});
  // replace: step within a flow (e.g. review cards) without piling up Back-button entries
  try{ history[opts&&opts.replace ? "replaceState" : "pushState"](route, "", "#"+name); }catch(e){}
  render();
}
window.addEventListener("popstate", e=>{
  route = (e.state && e.state.name) ? e.state : {name:"library"};
  render();
});
try{ history.replaceState(route, "", "#library"); }catch(e){}
function render(){
  $("tabLib").classList.toggle("active", route.name!=="review");
  $("tabRev").classList.toggle("active", route.name==="review");
  renderDuePill();
  const el = $("screen");
  if(route.name==="library") el.innerHTML = viewLibrary();
  else if(route.name==="add") el.innerHTML = viewAdd();
  else if(route.name==="text") el.innerHTML = viewText(route.id);
  else if(route.name==="train") el.innerHTML = viewTrain();
  else if(route.name==="review") el.innerHTML = viewReview();
  else if(route.name==="settings") el.innerHTML = viewSettings();
  window.scrollTo(0,0);
  afterRender();
}

function viewLibrary(){
  let html = `<h2 class="screen-title">Your texts</h2>`;
  if(!S.texts.length){
    html += `<div class="empty">
      <div class="big">Nothing memorized yet</div>
      Paste a poem, Quran passage, speech, or vocabulary — in any language — and ByHeart will walk you up the ladder until you know it cold.
      <div class="row" style="margin-top:20px;justify-content:center">
        <button class="primary" onclick="go('add')">Add a text</button>
        <button class="ghost" onclick="createExample()">Try an example</button>
      </div>
      <p style="margin-top:18px">Moving from another device? <button class="linkish" onclick="importData()">Restore a backup</button></p>
    </div>`;
    return html;
  }
  const ts = todayStats(), st = streak(), due = dueChunks().length;
  html += `<div class="today-strip">
    ${st?`<span class="flame">🔥 ${st}-day streak</span>`:`<span>Start your streak today</span>`}
    <span><b>${ts.learned}</b> learned today</span>
    <span><b>${ts.reviews}</b> reviews done</span>
    ${due?`<span><b>${due}</b> waiting</span>`:""}
  </div>`;
  html += `<div class="stack">`;
  for(const t of S.texts){
    const total=t.chunks.length;
    const learned=t.chunks.filter(c=>c.stage>=5).length;
    const due=t.chunks.filter(c=>isDue(c)).length;
    const pct = total? Math.round(100*t.chunks.reduce((a,c)=>a+Math.min(c.stage,5),0)/(5*total)) :0;
    const next = t.chunks.find(c=>c.stage<5);
    const action = next
      ? `<button class="continue-chip" onclick="event.stopPropagation();startTrain('${t.id}','${next.id}')">Continue →</button>`
      : due ? `<button class="continue-chip" onclick="event.stopPropagation();go('review')">Review ${due} →</button>` : "";
    html += `<div class="card tappable" role="button" tabindex="0" onclick="go('text',{id:'${t.id}'})">
      <div class="row spread">
        <strong class="${t.rtl?'rtl':''}" style="font-size:1.05rem">${esc(t.title)}</strong>
        ${due?`<span class="tag due">${due} due</span>`:`<span class="tag">${learned}/${total} by heart</span>`}
      </div>
      <div class="progressline"><i style="width:${pct}%"></i></div>
      <div class="row spread">
        <span class="muted">${total} chunks · ${pct}% learned</span>
        ${action}
      </div>
    </div>`;
  }
  html += `</div>
  <div style="margin-top:16px" class="row">
    <button class="ghost" onclick="exportData()">Backup</button>
    <button class="ghost" onclick="importData()">Restore</button>
  </div>`;
  return html;
}

const newChunks = pieces => pieces.map((text,i)=>({id:uid(), i, text, stage:0, ef:2.5, reps:0, interval:0, due:0}));

  const next = t.chunks.find(c=>c.stage<5);

      ${ladder(c)}
      <span class="snippet ${t.rtl?'rtl':''}">${esc(shorten(c.text,80))}</span>
      ${due?`<span class="tag due">due</span>`:c.stage>=5?`<span class="tag">${fmtIn(c.due)}</span>`:`<span class="tag">${STAGES[Math.min(c.stage,5)]}</span>`}

function askDelete(id){
  pendingDel = id; render();
  setTimeout(()=>{ if(pendingDel===id){ pendingDel=null; if(route.name==="text") render(); } }, 4000);
}
function reallyDelete(id){
  pendingDel = null;
  S.texts = S.texts.filter(t=>t.id!==id); save(); go("library");
  toast("Text deleted");
}
function ladder(c){
  let h = `<div class="ladder">`;
  for(let i=1;i<=4;i++) h+=`<span class="rung ${c.stage>=i?'done':''}"></span>`;
  h+=`<span class="rung heart ${c.stage>=5?'done':''}" title="by heart"></span></div>`;
  return h;
}
function shorten(s,n){ return s.length>n ? s.slice(0,n)+"…" : s; }
function fmtIn(ts){
  const d = ts-now();
  if(d<=0) return "now";
  if(d<HOUR) return Math.max(1,Math.round(d/MIN))+" min";
  const h = Math.round(d/HOUR);
  return h<24 ? h+"h" : Math.max(1,Math.round(d/DAY))+"d";
}

/* ============ Trainer ============ */
/* T is the current attempt. Modes:
   learn    — climb the ladder on a new chunk
   review   — the due queue
   recite   — the whole text in order
   practice — an already-learned chunk, off schedule */
let T = null;
const attempt = (textId, chunkId, mode) => ({textId, chunkId, mode, revealed:false, hint:false, peeks:0});
const getChunk = (t, id) => t && t.chunks.find(c=>c.id===id);
const trainStage = c => T.mode==="learn" ? Math.min(c.stage,4) : 4;
function startTrain(textId, chunkId){
  const c = getChunk(getText(textId), chunkId);
  T = attempt(textId, chunkId, c && c.stage>=5 ? "practice" : "learn");
  go("train");
}

const passageCls = t => (t.rtl?"rtl ":"") + (SPACELESS.has(t.lang)?"tight":"");
function wSpan(w, quran){
  if(quran && isAyahMark(w)) return `<span class="ayah">${esc(w)}</span>`;
  if(!w.trim()) return w; // whitespace token in spaceless scripts
  return `<span class="w">${esc(w)}</span>`;
}
function pickHidden(words, frac, quran){
  const eligible = words.map((w,i)=>i).filter(i=>isWordToken(words[i]) && !(quran && isAyahMark(words[i])));
  const n = Math.max(1, Math.round(eligible.length*frac));
  for(let i=eligible.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [eligible[i],eligible[j]]=[eligible[j],eligible[i]]; }
  return new Set(eligible.slice(0,n));
}
// "صَبَرُوا۟" → "صَ···": first letter (with its vowel mark), dots, trailing punctuation kept as a cue
function firstLetterCue(w){
  const g = graphemes(w);
  const a = Math.max(0, g.findIndex(isWordToken));
  let z = g.length; while(z > a+1 && !isWordToken(g[z-1])) z--;
  // Arabic: a zero-width joiner keeps the first letter in its connected (initial) form
  const zwj = z > a+1 && ARABIC_CHAR.test(g[a]) ? ZWJ : "";
  return esc(g.slice(0,a+1).join(""))+zwj
    + `<span class="rest">${"·".repeat(Math.max(1,Math.min(z-a-1,6)))}</span>`
    + esc(g.slice(z).join(""));
}
// Spaceless scripts: most words are one or two characters, so cue the first character of each clause
function clauseCues(words){
  let clauseStart = true;
  return words.map(w=>{
    if(!isWordToken(w)){ if(w.trim()) clauseStart = true; return wSpan(w,false); }
    const g = graphemes(w);
    const html = `<span class="w fl">${clauseStart?esc(g[0]):""}<span class="rest">${"·".repeat(g.length-(clauseStart?1:0))}</span></span>`;
    clauseStart = false;
    return html;
  }).join("");
}
function firstLetters(t,c){
  const q = !!t.quran, words = tokenize(c.text, t.lang);
  const body = SPACELESS.has(t.lang) ? clauseCues(words) : words.map(w=>
    !isWordToken(w) || (q && isAyahMark(w)) ? wSpan(w,q) : `<span class="w fl">${firstLetterCue(w)}</span>`
  ).join(" ");
  return `<div class="passage ${passageCls(t)}">${body}</div>`;
}
function peek(el){
  el.classList.toggle("peeked");
  const on = el.classList.contains("peeked");
  el.setAttribute("aria-label", on ? el.textContent : "hidden word");
  if(on){
    T.peeks = (T.peeks||0)+1;
    const m=$("peekMeter");
    if(m) m.innerHTML = "Peeks this attempt: <b>"+T.peeks+"</b>";
  }
}
function renderPassage(t, c, stage){
  const words = tokenize(c.text, t.lang);
  const cls = passageCls(t), J = joiner(t.lang);
  const q = !!t.quran;
  if(stage===0 || stage>=4 && T.revealed){ // full text
    return `<div class="passage ${cls}">${words.map(w=>wSpan(w,q)).join(J)}</div>`;
  }
  if(stage===1||stage===2){
    const frac = stage===1?0.3:0.6;
    const hidden = pickHidden(words, frac, q);
    return `<div class="passage ${cls}">${words.map((w,i)=>
      hidden.has(i)
        ? `<span class="w veiled" role="button" tabindex="0" aria-label="hidden word" onclick="peek(this)">${esc(w)}</span>`
        : wSpan(w,q)).join(J)}</div>
    <div class="peekmeter" id="peekMeter">${T.peeks?`Peeks this attempt: <b>${T.peeks}</b>`:"Tap a veiled word only if you must — struggling first is what builds the memory."}</div>`;
  }
  if(stage===3){ // first letters; ayah marks stay whole as anchors
    return firstLetters(t,c);
  }
  // stage 4+ blind — with optional first-letter hint
  if(T.hint) return firstLetters(t,c);
  return `<div class="blind-box">Recite it out loud from memory — then reveal and check yourself.</div>`;
}
function prevCue(t,c){
  if(c.i===0) return "";
  const prev = t.chunks[c.i-1];
  const tail = tokenize(prev.text, t.lang).slice(-6).join(joiner(t.lang)).trim();
  return `<div class="cue ${t.rtl?'rtl':''}" title="end of previous chunk">… ${esc(tail)}</div>`;
}

function viewTrain(){
  if(!T) return viewLibrary();
  const t = getText(T.textId); if(!t) return viewLibrary();
  const c = getChunk(t, T.chunkId); if(!c) return viewText(t.id);
  const stage = trainStage(c);
  const idx = c.i+1;
  const label = {review:"Review · "+dueChunks().length+" left", recite:"Recitation", practice:"Practice"}[T.mode] || STAGES[stage];

  let controls = "";
  if(T.mode==="learn" && stage<4){
    const tips = [
      "Read it slowly twice, then say it out loud once.",
      "Read aloud — tap any veiled word only if you truly need it.",
      "More is hidden now. Recite the whole chunk, peeking as little as possible.",
      "Only first letters remain. Recite the full chunk from these cues."
    ];
    controls = `<p class="hint">${tips[stage]}</p>
    <div class="row" style="margin-top:14px">
      <button class="primary" onclick="advanceStage(1)">Got it — next step</button>
      ${stage>0?`<button class="ghost" onclick="advanceStage(-1)">Too hard — step back</button>`:""}
    </div>`;
  } else { // blind recall (learn stage 4, or review/recite/practice)
    if(!T.revealed){
      controls = `${T.mode==="practice"&&!isDue(c)?`<p class="hint">Already by heart — practising won't push its next review later. Only "Again" brings it back sooner.</p>`:""}
      <div class="row" style="margin-top:14px">
        <button class="primary" onclick="T.revealed=true;render()">Reveal & check</button>
        ${!T.hint?`<button class="ghost" onclick="T.hint=true;render()">Hint — first letters</button>`:""}
      </div>
      ${T.hint?`<p class="hint">Hint shown — if you needed it, grade yourself no higher than Hard.</p>`:""}`;
    } else {
      controls = `<p class="hint">${T.hint?"You used the hint — be honest and grade no higher than Hard.":"How did it go? Be honest — honest grading is what makes the schedule work."}</p>
      <div class="grades">
        <button class="grade g-again" onclick="doGrade(0)">Again<small>blanked</small></button>
        <button class="grade g-hard" onclick="doGrade(1)">Hard<small>hesitant</small></button>
        <button class="grade g-good" onclick="doGrade(2)">Good<small>solid</small></button>
        <button class="grade g-easy" onclick="doGrade(3)">Easy<small>flawless</small></button>
      </div>`;
    }
  }

  return `<div class="trainer-head">
    <button class="icon" onclick="${T.mode==='review'?"go('review')":`go('text',{id:'${t.id}'})`}" aria-label="Back">←</button>
    <span class="chunk-count ${t.rtl?'rtl':''}">${esc(shorten(t.title,26))} · ${idx}/${t.chunks.length}</span>
    <span></span>
  </div>
  <div class="stagebar">
    <div class="row spread">
      <span class="stage-name">${label}</span>
      ${ladder(c)}
    </div>
  </div>
  ${prevCue(t,c)}
  ${renderPassage(t,c,stage)}
  ${controls}`;
}

function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
function resetAttempt(){ T.revealed=false; T.hint=false; T.peeks=0; }
function advanceStage(d){
  const c=getChunk(getText(T.textId), T.chunkId); if(!c) return;
  c.stage = Math.max(0, Math.min(4, c.stage+d));
  resetAttempt(); buzz();
  save(); render();
}
function doGrade(g){
  const t=getText(T.textId), c=getChunk(t, T.chunkId); if(!c) return;
  buzz();
  if(T.mode==="learn"){
    if(g>=2){ // graduated!
      c.stage=5; gradeChunk(c,g); logActivity("learned"); save();
      const next = t.chunks.find(x=>x.stage<5);
      toast("By heart ✓ — review scheduled in "+fmtIn(c.due));
      if(next){ T=attempt(t.id, next.id, "learn"); render(); }
      else { toast("Whole text learned — reviews will keep it fresh"); go("text",{id:t.id}); }
    } else {
      c.stage = g===0?1:3; // drop back for relearning
      resetAttempt(); save(); render();
      toast(g===0?"No problem — back to a lighter veil":"Back to first letters");
    }
    return;
  }
  if(T.mode==="review"){
    gradeChunk(c,g); // "Again" stays in the queue, due in 10 minutes
    logActivity("reviews");
    R.done++; if(g===0) R.again++;
    save();
    nextReview();
    return;
  }
  // recite / practice happen off schedule: a due chunk counts as its review,
  // a blank brings it back soon, and anything else leaves the schedule alone
  // (grading early would stretch intervals the chunk hasn't earned yet)
  if(c.stage>=5){
    if(isDue(c)){ gradeChunk(c,g); logActivity("reviews"); }
    else if(g===0) gradeChunk(c,0);
  }
  save();
  if(T.mode==="recite"){
    const next = t.chunks[c.i+1];
    if(next){ T=attempt(t.id, next.id, "recite"); render(); }
    else { toast("Full recitation complete 🎉"); go("text",{id:t.id}); }
  } else {
    toast(g===0 ? "It'll come back for review in 10 minutes" : "Nice — next review in "+fmtIn(c.due));
    go("text",{id:t.id});
  }
}

/* ============ Review queue ============ */
let R = {done:0, again:0};
function viewReview(){
  const due = dueChunks();
  if(!due.length){
    if(R.done>0){
      const html = `<h2 class="screen-title">Review</h2>
      <div class="card summary-card">
        <div class="bignum">${R.done}</div>
        <p>review${R.done===1?"":"s"} completed${R.again?` — ${R.again} coming back in 10 minutes`:" — all remembered"} 🎉</p>
        ${streak()?`<p class="muted" style="margin-top:6px">🔥 ${streak()}-day streak</p>`:""}
        <div style="margin-top:14px"><button class="primary" onclick="R={done:0,again:0};go('library')">Done</button></div>
      </div>`;
      return html;
    }
    const soon = S.texts.flatMap(t=>t.chunks).filter(c=>c.stage>=5).sort((a,b)=>a.due-b.due)[0];
    return `<h2 class="screen-title">Review</h2>
    <div class="empty"><div class="big">Nothing due right now</div>
    ${soon?`Next review in ${fmtIn(soon.due)}. Reviews arrive just before you'd forget — that struggle is what builds the memory.`:"Learn some chunks first and they'll show up here on a spaced schedule."}
    </div>`;
  }
  return `<h2 class="screen-title">Review — ${due.length} due</h2>
  <div class="card">
    <p>Each card: recite from memory, reveal, grade yourself honestly. "Again" brings it back in 10 minutes; "Easy" pushes it far into the future.</p>
    <div style="margin-top:12px"><button class="primary" onclick="R={done:0,again:0};nextReview()">Start reviewing</button></div>
  </div>`;
}
function nextReview(){
  const due = dueChunks();
  const replace = route.name==="train"; // one Back-button entry for the whole session
  if(!due.length){ go("review", null, {replace}); return; }
  const {t,c} = due[0];
  T = attempt(t.id, c.id, "review");
  go("train", null, {replace});
}

/* ============ Recite whole ============ */
function reciteAll(id){
  const t=getText(id); if(!t || !t.chunks.length) return;
  T = attempt(id, t.chunks[0].id, "recite");
  toast("Recite each chunk in order, then grade yourself");
  go("train");
}

/* ============ Settings: themes, mode, Arabic size ============ */
const THEMES = [
  {id:"ink",     name:"Midnight Saffron", sw:{dark:["#0F1322","#1A2138","#E4A63C"], light:["#F7F3E9","#FFFFFF","#A8720F"]}},
  {id:"andalus", name:"Andalus",          sw:{dark:["#0B1512","#132420","#4FB584"], light:["#EFF4EE","#FFFFFF","#1F7A55"]}},
  {id:"rose",    name:"Damascene Rose",   sw:{dark:["#181019","#251A28","#E094AC"], light:["#F9F2F5","#FFFFFF","#A8355F"]}}
];
function applySettings(){
  const st = S.settings;
  const root = document.documentElement;
  root.dataset.theme = st.theme;
  root.dataset.mode = st.mode;
  root.style.setProperty("--ar-size", st.arSize+"rem");
  // keep the Android status bar in tune with the theme
  requestAnimationFrame(()=>{
    const bg = getComputedStyle(document.body).backgroundColor;
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta && bg) meta.setAttribute("content", bg);
  });
}
function setTheme(id){ S.settings.theme=id; save(); applySettings(); render(); }
function setMode(m){ S.settings.mode=m; save(); applySettings(); render(); }
function setArSize(v){
  S.settings.arSize = parseFloat(v); save(); applySettings();
  const lbl=$("arSizeLbl"); if(lbl) lbl.textContent = Math.round(S.settings.arSize*10)+"pt";
}
function viewSettings(){
  const st=S.settings;
  let themes = THEMES.map(t=>{
    const sw = t.sw[st.mode]||t.sw.dark;
    return `<div class="theme-card ${st.theme===t.id?'selected':''}" role="button" tabindex="0" aria-pressed="${st.theme===t.id}" onclick="setTheme('${t.id}')">
      <div class="swatches">${sw.map(c=>`<span class="sw" style="background:${c}"></span>`).join("")}</div>
      <div class="tname">${t.name}</div>
    </div>`;
  }).join("");
  return `<h2 class="screen-title">Appearance</h2>
  <div class="card stack">
    <div>
      <label class="field">Theme</label>
      <div class="theme-grid">${themes}</div>
    </div>
    <div>
      <label class="field">Mode</label>
      <div class="mode-toggle">
        <button class="${st.mode==='dark'?'on':''}" onclick="setMode('dark')">Dark</button>
        <button class="${st.mode==='light'?'on':''}" onclick="setMode('light')">Light</button>
      </div>
    </div>
    <div>
      <label class="field" for="arSize">Arabic text size — <span id="arSizeLbl">${Math.round(st.arSize*10)}pt</span></label>
      <input type="range" id="arSize" min="1.2" max="2.6" step="0.1" value="${st.arSize}" oninput="setArSize(this.value)">
      <div class="ar-preview" style="margin-top:10px">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    </div>
  </div>
  <h2 class="screen-title" style="margin-top:22px">Your data</h2>
  <div class="card stack">
    <p class="muted">Texts and progress live only on this device. Save a backup file before clearing browser data, or to move to another phone.</p>
    <div class="row">
      <button class="ghost" onclick="exportData()">Backup</button>
      <button class="ghost" onclick="importData()">Restore</button>
    </div>
  </div>
  <div><button class="ghost" onclick="go('library')">Done</button></div>`;
}

/* ============ backup / restore ============ */
function exportData(){
  const url = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `byheart-backup-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange = () => {
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let next;
      try{ next = normalizeState(JSON.parse(r.result)); }
      catch(e){ toast("That file isn't a ByHeart backup"); return; }
      const plural = n => n+" text"+(n===1?"":"s");
      if(S.texts.length && !confirm(`Replace the ${plural(S.texts.length)} on this device with the ${plural(next.texts.length)} in this backup?`)) return;
      S = next; save(); requestPersist(); applySettings();
      go("library");
      toast("Backup restored — "+plural(S.texts.length));
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ Service worker: offline support & installability ============ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* e.g. opened as a local file — app still works, just not offline-installable */ });
  });
}

function afterRender(){}
document.addEventListener("keydown", e=>{
  const el = e.target;
  // clickable cards, rows and veiled words (role="button") respond to Enter/Space like real buttons
  if((e.key==="Enter"||e.key===" ") && el.getAttribute && el.getAttribute("role")==="button" && el.tagName!=="BUTTON"){
    e.preventDefault(); el.click(); return;
  }
  /* trainer shortcuts (desktop): Space/Enter reveal or advance · 1-4 grade · H hint */
  if(route.name!=="train" || !T || e.ctrlKey || e.metaKey || e.altKey) return;
  if(el.closest && el.closest("button,a,input,textarea,select")) return; // let focused controls act on their own
  const c=getChunk(getText(T.textId), T.chunkId); if(!c) return;
  const stage=trainStage(c);
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    if(stage<4){ advanceStage(1); }
    else if(!T.revealed){ T.revealed=true; render(); }
  } else if(stage>=4 && T.revealed && ["1","2","3","4"].includes(e.key)){
    doGrade(parseInt(e.key,10)-1);
  } else if(stage>=4 && !T.revealed && (e.key==="h"||e.key==="H")){
    T.hint=true; render();
  }
});
S = load();
applySettings();
render();
</script>
